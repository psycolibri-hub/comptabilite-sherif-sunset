<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effectifs — Bureau du Shérif de Sunset</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rye&family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --parchment: #f4e4bc;
    --parchment-dark: #e8d5a3;
    --wood-dark: #3d2b1f;
    --wood-medium: #5c3d2e;
    --wood-light: #8b5e3c;
    --gold: #c9a227;
    --gold-light: #e8c84b;
    --rust: #8b3a1a;
    --rust-light: #a84d2a;
    --ink: #2a1a0f;
    --ink-light: #5a3d2a;
    --cream: #faf3e0;
    --shadow: rgba(42, 26, 15, 0.15);
    --shadow-heavy: rgba(42, 26, 15, 0.35);
  }

  body {
    font-family: 'Playfair Display', Georgia, serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .wood-border-top {
    height: 8px;
    background: linear-gradient(180deg, var(--wood-dark) 0%, var(--wood-medium) 50%, var(--wood-dark) 100%);
    border-bottom: 2px solid var(--gold);
    box-shadow: 0 2px 12px var(--shadow-heavy);
  }

  .wood-border-bottom {
    height: 8px;
    background: linear-gradient(180deg, var(--wood-dark) 0%, var(--wood-medium) 50%, var(--wood-dark) 100%);
    border-top: 2px solid var(--gold);
    box-shadow: 0 -2px 12px var(--shadow-heavy);
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 32px 20px 24px;
  }

  .back-link {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--wood-light);
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--rust); }

  .auth-btn {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    background: transparent;
    border: 1px solid var(--wood-light);
    color: var(--wood-medium);
    padding: 6px 14px;
    border-radius: 2px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .auth-btn:hover {
    background: var(--wood-medium);
    color: var(--cream);
  }

  .auth-btn.logout {
    border-color: var(--rust);
    color: var(--rust);
  }

  .auth-btn.logout:hover {
    background: var(--rust);
    color: var(--cream);
  }

  h1 {
    font-family: 'Rye', 'Cinzel', serif;
    font-size: clamp(24px, 4vw, 36px);
    color: var(--wood-dark);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 var(--parchment-dark), 2px 2px 0 var(--shadow);
  }

  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: var(--ink-light);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 20px auto 28px;
    max-width: 400px;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--wood-light), transparent);
  }

  .divider-ornament {
    width: 8px;
    height: 8px;
    border: 1.5px solid var(--gold);
    transform: rotate(45deg);
    background: var(--parchment);
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  .form-section {
    background: var(--cream);
    border: 1.5px solid var(--wood-light);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 32px;
    box-shadow: 0 2px 8px var(--shadow);
    transition: border-color 0.3s;
  }

  .form-section.editing {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15), 0 2px 8px var(--shadow);
  }

  .form-section h2 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--wood-dark);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
    text-align: center;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--ink-light);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }

  input, select, textarea {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--wood-light);
    border-radius: 4px;
    background: var(--parchment);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.15);
  }

  textarea { resize: vertical; min-height: 60px; }

  .btn-add {
    grid-column: 1 / -1;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px;
    background: var(--wood-dark);
    color: var(--gold-light);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-top: 8px;
  }

  .btn-add:hover {
    background: var(--wood-medium);
    color: var(--gold);
    box-shadow: 0 4px 12px var(--shadow-heavy);
  }

  .btn-add:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-cancel {
    grid-column: 1 / -1;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px;
    background: transparent;
    color: var(--rust);
    border: 1px solid var(--rust);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }

  .btn-cancel:hover {
    background: var(--rust);
    color: var(--cream);
  }

  .success-msg {
    grid-column: 1 / -1;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: #2e7d32;
    background: #c8e6c9;
    padding: 8px;
    border-radius: 4px;
    display: none;
    letter-spacing: 1px;
  }

  .roster-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .roster-header h2 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--wood-dark);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .count-badge {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    background: var(--wood-dark);
    color: var(--gold-light);
    padding: 4px 14px;
    border-radius: 2px;
    letter-spacing: 1px;
  }

  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .member-card {
    background: var(--cream);
    border: 1.5px solid var(--wood-light);
    border-radius: 4px;
    padding: 20px;
    position: relative;
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px var(--shadow);
  }

  .member-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px var(--shadow-heavy);
    border-color: var(--gold);
  }

  .member-card .rank-strip {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--rust), var(--gold));
    border-radius: 4px 4px 0 0;
  }

  .member-card .rank {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rust);
    margin-bottom: 8px;
  }

  .member-card .name {
    font-family: 'Rye', 'Cinzel', serif;
    font-size: 18px;
    color: var(--wood-dark);
    margin-bottom: 4px;
  }

  .member-card .since {
    font-size: 12px;
    color: var(--ink-light);
    font-style: italic;
    margin-bottom: 10px;
  }

  .member-card .desc {
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .member-card .actions {
    display: flex;
    gap: 8px;
  }

  .btn-edit, .btn-remove {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-edit {
    background: transparent;
    color: var(--wood-medium);
    border: 1px solid var(--wood-medium);
  }

  .btn-edit:hover {
    background: var(--wood-medium);
    color: var(--cream);
  }

  .btn-remove {
    background: transparent;
    color: var(--rust);
    border: 1px solid var(--rust);
  }

  .btn-remove:hover {
    background: var(--rust);
    color: var(--cream);
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-light);
    font-style: italic;
    font-size: 15px;
  }

  .loading-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-light);
    font-size: 15px;
  }

  .error-banner {
    background: var(--rust);
    color: var(--cream);
    padding: 14px 24px;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 1px;
    display: none;
    position: relative;
    z-index: 10;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42, 26, 15, 0.6);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.active { display: flex; }

  .modal-box {
    background: var(--cream);
    border: 2px solid var(--wood-light);
    border-radius: 4px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 8px 32px var(--shadow-heavy);
    text-align: center;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--ink-light);
    cursor: pointer;
    line-height: 1;
  }

  .modal-box h2 {
    font-family: 'Rye', 'Cinzel', serif;
    font-size: 22px;
    color: var(--wood-dark);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .modal-box .modal-sub {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--ink-light);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .modal-box .form-group {
    text-align: left;
    margin-bottom: 16px;
  }

  .modal-box .btn-add {
    margin-top: 8px;
    width: 100%;
  }

  .modal-error {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--rust);
    background: #ffebee;
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 16px;
    display: none;
    letter-spacing: 0.5px;
  }

  .auth-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--gold-light);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    border-top: 1px solid var(--wood-light);
    margin: 0 20px;
  }

  footer p {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--ink-light);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  footer .star-sep {
    color: var(--gold);
    margin: 0 8px;
  }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .back-link { position: static; display: block; margin-bottom: 12px; transform: none; }
    .auth-btn { position: static; display: block; margin: 12px auto 0; transform: none; }
    header { padding-top: 20px; }
    .roster-grid { grid-template-columns: 1fr; }
    .modal-box { padding: 28px 20px; }
  }
</style>
</head>
<body>

  <div class="error-banner" id="errorBanner"></div>

  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      <h2>Connexion Admin</h2>
      <p class="modal-sub">Bureau du Shérif — Accès réservé</p>
      <div class="modal-error" id="authError"></div>
      <div class="form-group">
        <label for="authEmail">Adresse e-mail</label>
        <input type="email" id="authEmail" placeholder="admin@sunset.sh" required>
      </div>
      <div class="form-group">
        <label for="authPassword">Mot de passe</label>
        <input type="password" id="authPassword" placeholder="••••••••" required>
      </div>
      <button type="button" class="btn-add" id="authBtn" onclick="handleLogin()">Se connecter</button>
    </div>
  </div>

  <div class="wood-border-top"></div>

  <header>
    <a href="index.html" class="back-link">← Retour</a>
    <button class="auth-btn" id="authActionBtn" onclick="openAuthModal()">Connexion admin</button>
    <h1>Effectifs du Bureau</h1>
    <p class="subtitle">Bureau du Shérif — Sunset, Texas</p>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-ornament"></div>
      <div class="divider-line"></div>
    </div>
  </header>

  <main>
    <section class="form-section" id="formSection" style="display:none;">
      <h2 id="formTitle">Ajouter un membre</h2>
      <form id="addForm" class="form-grid" onsubmit="event.preventDefault();">
        <input type="hidden" id="editId" value="">
        <div class="form-group">
          <label for="mName">Nom & Prénom</label>
          <input type="text" id="mName" placeholder="Ex: John Marston" required>
        </div>
        <div class="form-group">
          <label for="mRank">Grade</label>
          <select id="mRank" required>
            <option value="Shérif en chef">Shérif en chef</option>
            <option value="Shérif adjoint">Shérif adjoint</option>
            <option value="Shérif">Shérif</option>
          </select>
        </div>
        <div class="form-group">
          <label for="mSince">En service depuis</label>
          <input type="date" id="mSince" required>
        </div>
        <div class="form-group">
          <label for="mStatus">Statut</label>
          <select id="mStatus">
            <option value="Actif">Actif</option>
            <option value="En congé">En congé</option>
            <option value="Suspendu">Suspendu</option>
          </select>
        </div>
        <div class="form-group full">
          <label for="mDesc">Description / Notes</label>
          <textarea id="mDesc" placeholder="Spécialité, traits de caractère, historique..."></textarea>
        </div>
        <div class="success-msg" id="successMsg">✓ Membre enregistré avec succès</div>
        <button type="submit" class="btn-add" id="submitBtn">Enregistrer l'effectif</button>
        <button type="button" class="btn-cancel" id="cancelBtn" onclick="cancelEdit()">Annuler la modification</button>
      </form>
    </section>

    <div class="roster-header">
      <h2>Roster</h2>
      <span class="count-badge" id="countBadge">Chargement...</span>
    </div>
    <div id="roster" class="roster-grid">
      <div class="loading-state" style="grid-column: 1 / -1;">
        <p>Connexion au registre central...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>Bureau du Shérif de Sunset <span class="star-sep">★</span> Établi 1904 <span class="star-sep">★</span> Serveur Red Dead RP</p>
  </footer>

  <div class="wood-border-bottom"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://dzdnhnmwluznrxijkkzc.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6ZG5obm13bHV6bnJ4aWpra3pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjU5MDIsImV4cCI6MjEwMTYwMTkwMn0.CCyPCwp881OZl0RAYhefYUV4cBUPA6j_hKdSqVnec74';

  let supabaseClient = null;
  let isAdmin = false;

  const errorBanner = document.getElementById('errorBanner');
  const successMsg = document.getElementById('successMsg');
  const rosterContainer = document.getElementById('roster');
  const countBadge = document.getElementById('countBadge');
  const form = document.getElementById('addForm');
  const submitBtn = document.getElementById('submitBtn');
  const authModal = document.getElementById('authModal');
  const authError = document.getElementById('authError');
  const authBtn = document.getElementById('authBtn');
  const authActionBtn = document.getElementById('authActionBtn');
  const formSection = document.getElementById('formSection');

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    successMsg.style.display = 'none';
    console.error('[Supabase]', msg);
  }

  function hideError() {
    errorBanner.style.display = 'none';
  }

  function showSuccess(msg) {
    successMsg.textContent = msg;
    successMsg.style.display = 'block';
    errorBanner.style.display = 'none';
    setTimeout(() => { successMsg.style.display = 'none'; }, 3000);
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    e.stopPropagation();
  });

  try {
    if (typeof window.supabase === 'undefined') {
      throw new Error("Le SDK Supabase n'a pas chargé. Vérifie ta connexion internet.");
    }
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (err) {
    showError(err.message);
    rosterContainer.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <p>Impossible de démarrer le registre.<br>Vérifie la bannière rouge ci-dessus.</p>
      </div>`;
    countBadge.textContent = 'Erreur';
    submitBtn.disabled = true;
  }

  async function checkSession() {
    if (!supabaseClient) return;
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      setAdminMode(true);
    } else {
      setAdminMode(false);
    }
  }

  function setAdminMode(admin) {
    isAdmin = admin;
    if (admin) {
      formSection.style.display = 'block';
      authActionBtn.textContent = 'Déconnexion';
      authActionBtn.classList.add('logout');
      authActionBtn.onclick = handleLogout;
    } else {
      formSection.style.display = 'none';
      authActionBtn.textContent = 'Connexion admin';
      authActionBtn.classList.remove('logout');
      authActionBtn.onclick = openAuthModal;
    }
    loadRoster();
  }

  function openAuthModal() {
    authModal.classList.add('active');
    document.getElementById('authEmail').focus();
  }

  function closeAuthModal() {
    authModal.classList.remove('active');
    authError.style.display = 'none';
    document.getElementById('authEmail').value = '';
    document.getElementById('authPassword').value = '';
  }

  async function handleLogin() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;

    if (!email || !password) {
      authError.textContent = 'Veuillez remplir tous les champs.';
      authError.style.display = 'block';
      return;
    }

    authBtn.disabled = true;
    authBtn.innerHTML = '<span class="auth-spinner"></span> Connexion...';
    authError.style.display = 'none';

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        authError.textContent = 'Connexion refusée. Vérifie tes identifiants.';
        authError.style.display = 'block';
        console.error(error);
        return;
      }

      closeAuthModal();
      setAdminMode(true);
    } catch (err) {
      authError.textContent = 'Erreur de connexion : ' + err.message;
      authError.style.display = 'block';
    } finally {
      authBtn.disabled = false;
      authBtn.textContent = 'Se connecter';
    }
  }

  async function handleLogout() {
    if (!supabaseClient) return;
    await supabaseClient.auth.signOut();
    setAdminMode(false);
    cancelEdit();
  }

  if (supabaseClient) {
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN') {
        setAdminMode(true);
      } else if (event === 'SIGNED_OUT') {
        setAdminMode(false);
      }
    });
  }

  document.getElementById('authPassword').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') handleLogin();
  });

  authModal.addEventListener('click', function(e) {
    if (e.target === authModal) closeAuthModal();
  });

  const formTitle = document.getElementById('formTitle');
  const cancelBtn = document.getElementById('cancelBtn');
  const editIdInput = document.getElementById('editId');

  async function loadRoster() {
    if (!supabaseClient) return;

    hideError();
    try {
      const { data, error } = await supabaseClient
        .from('effectifs')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        showError('Erreur Supabase : ' + error.message);
        rosterContainer.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <p>Le registre est inaccessible.<br>Vérifie que la table "effectifs" existe et que RLS est configuré.</p>
          </div>`;
        countBadge.textContent = 'Erreur';
        return;
      }

      render(data || []);
    } catch (err) {
      showError('Erreur de chargement : ' + err.message);
    }
  }

  function render(list) {
    countBadge.textContent = list.length + ' membre' + (list.length > 1 ? 's' : '');

    if (list.length === 0) {
      rosterContainer.innerHTML = `
        <div class="empty-state" style="grid-column: 1 / -1;">
          <p>Aucun effectif enregistré. Le bureau attend ses hommes...</p>
        </div>`;
      return;
    }

    rosterContainer.innerHTML = list.map(m => {
      const actions = isAdmin ? `
        <div class="actions">
          <button class="btn-edit" onclick="startEdit(${m.id}, '${escapeJs(m.name)}', '${escapeJs(m.rank)}', '${m.since}', '${escapeJs(m.status)}', '${escapeJs(m.description || '')}')">Modifier</button>
          <button class="btn-remove" onclick="removeMember(${m.id})">Retirer</button>
        </div>
      ` : '';

      return `
      <div class="member-card">
        <div class="rank-strip"></div>
        <div class="rank">${escapeHtml(m.rank)}</div>
        <div class="name">${escapeHtml(m.name)}</div>
        <div class="since">En service depuis le ${formatDate(m.since)}</div>
        ${m.description ? `<div class="desc">${escapeHtml(m.description)}</div>` : ''}
        ${actions}
      </div>
    `}).join('');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function escapeJs(str) {
    return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
  }

  async function handleSubmit(e) {
    e.preventDefault();
    hideError();

    if (!supabaseClient) {
      showError('Connexion à Supabase non établie.');
      return;
    }

    const name = document.getElementById('mName').value.trim();
    const rank = document.getElementById('mRank').value;
    const since = document.getElementById('mSince').value;
    const status = document.getElementById('mStatus').value;
    const description = document.getElementById('mDesc').value.trim();
    const editId = editIdInput.value;

    if (!name || !since) return;

    submitBtn.disabled = true;
    submitBtn.textContent = editId ? 'Mise à jour...' : 'Enregistrement...';

    try {
      if (editId) {
        const { error } = await supabaseClient
          .from('effectifs')
          .update({ name, rank, since, status, description })
          .eq('id', editId);

        if (error) { showError('Erreur modification : ' + error.message); return; }
        showSuccess('✓ Membre mis à jour avec succès');
      } else {
        const { error } = await supabaseClient
          .from('effectifs')
          .insert([{ name, rank, since, status, description }]);

        if (error) { showError('Erreur enregistrement : ' + error.message); return; }
        showSuccess('✓ Membre enregistré avec succès');
      }

      cancelEdit();
      await loadRoster();
    } catch (err) {
      showError('Erreur inattendue : ' + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = editId ? "Mettre à jour" : "Enregistrer l'effectif";
    }
  }

  form.addEventListener('submit', handleSubmit);

  function startEdit(id, name, rank, since, status, description) {
    document.getElementById('mName').value = name;
    document.getElementById('mRank').value = rank;
    document.getElementById('mSince').value = since;
    document.getElementById('mStatus').value = status;
    document.getElementById('mDesc').value = description;
    editIdInput.value = id;

    formTitle.textContent = 'Modifier un membre';
    submitBtn.textContent = 'Mettre à jour';
    cancelBtn.style.display = 'block';
    formSection.classList.add('editing');
    successMsg.style.display = 'none';

    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('mName').focus();
  }

  function cancelEdit() {
    form.reset();
    editIdInput.value = '';
    formTitle.textContent = 'Ajouter un membre';
    submitBtn.textContent = "Enregistrer l'effectif";
    cancelBtn.style.display = 'none';
    formSection.classList.remove('editing');
    successMsg.style.display = 'none';
  }

  async function removeMember(id) {
    if (!confirm('Retirer ce membre du registre ?')) return;
    if (!supabaseClient) return;

    try {
      const { error } = await supabaseClient
        .from('effectifs')
        .delete()
        .eq('id', id);

      if (error) { showError('Erreur suppression : ' + error.message); }
      else { await loadRoster(); }
    } catch (err) {
      showError('Erreur suppression : ' + err.message);
    }
  }

  if (supabaseClient) {
    supabaseClient
      .channel('effectifs-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'effectifs' }, () => {
        loadRoster();
      })
      .subscribe();
  }

  checkSession();
</script>

</body>
</html>
