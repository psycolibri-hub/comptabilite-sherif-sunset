<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Effectifs — Bureau du Shérif de Sunset</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rye&family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --parchment: #f4e4bc;
    --parchment-dark: #e8d5a3;
    --wood-dark: #3d2b1f;
    --wood-medium: #5c3d2e;
    --wood-light: #8b5e3c;
    --gold: #c9a227;
    --gold-light: #e8c84b;
    --rust: #8b3a1a;
    --rust-light: #a84d2a;
    --ink: #2a1a0f;
    --ink-light: #5a3d2a;
    --cream: #faf3e0;
    --shadow: rgba(42, 26, 15, 0.15);
    --shadow-heavy: rgba(42, 26, 15, 0.35);
  }

  body {
    font-family: 'Playfair Display', Georgia, serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .wood-border-top {
    height: 8px;
    background: linear-gradient(180deg, var(--wood-dark) 0%, var(--wood-medium) 50%, var(--wood-dark) 100%);
    border-bottom: 2px solid var(--gold);
    box-shadow: 0 2px 12px var(--shadow-heavy);
  }

  .wood-border-bottom {
    height: 8px;
    background: linear-gradient(180deg, var(--wood-dark) 0%, var(--wood-medium) 50%, var(--wood-dark) 100%);
    border-top: 2px solid var(--gold);
    box-shadow: 0 -2px 12px var(--shadow-heavy);
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 32px 20px 24px;
  }

  .back-link {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--wood-light);
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--rust); }

  h1 {
    font-family: 'Rye', 'Cinzel', serif;
    font-size: clamp(24px, 4vw, 36px);
    color: var(--wood-dark);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 var(--parchment-dark), 2px 2px 0 var(--shadow);
  }

  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: var(--ink-light);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 20px auto 28px;
    max-width: 400px;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--wood-light), transparent);
  }

  .divider-ornament {
    width: 8px;
    height: 8px;
    border: 1.5px solid var(--gold);
    transform: rotate(45deg);
    background: var(--parchment);
  }

  main {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  .form-section {
    background: var(--cream);
    border: 1.5px solid var(--wood-light);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 32px;
    box-shadow: 0 2px 8px var(--shadow);
    transition: border-color 0.3s;
  }

  .form-section.editing {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15), 0 2px 8px var(--shadow);
  }

  .form-section h2 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--wood-dark);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
    text-align: center;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group.full { grid-column: 1 / -1; }

  label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--ink-light);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }

  input, select, textarea {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--wood-light);
    border-radius: 4px;
    background: var(--parchment);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.15);
  }

  textarea { resize: vertical; min-height: 60px; }

  .btn-add {
    grid-column: 1 / -1;
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px;
    background: var(--wood-dark);
    color: var(--gold-light);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-top: 8px;
  }

  .btn-add:hover {
    background: var(--wood-medium);
    color: var(--gold);
    box-shadow: 0 4px 12px var(--shadow-heavy);
  }

  .btn-cancel {
    grid-column: 1 / -1;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 10px;
    background: transparent;
    color: var(--rust);
    border: 1px solid var(--rust);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    display: none;
  }

  .btn-cancel:hover {
    background: var(--rust);
    color: var(--cream);
  }

  .roster-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .roster-header h2 {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    color: var(--wood-dark);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .count-badge {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    background: var(--wood-dark);
    color: var(--gold-light);
    padding: 4px 14px;
    border-radius: 2px;
    letter-spacing: 1px;
  }

  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .member-card {
    background: var(--cream);
    border: 1.5px solid var(--wood-light);
    border-radius: 4px;
    padding: 20px;
    position: relative;
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px var(--shadow);
  }

  .member-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px var(--shadow-heavy);
    border-color: var(--gold);
  }

  .member-card .rank-strip {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--rust), var(--gold));
    border-radius: 4px 4px 0 0;
  }

  .member-card .rank {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rust);
    margin-bottom: 8px;
  }

  .member-card .name {
    font-family: 'Rye', 'Cinzel', serif;
    font-size: 18px;
    color: var(--wood-dark);
    margin-bottom: 4px;
  }

  .member-card .since {
    font-size: 12px;
    color: var(--ink-light);
    font-style: italic;
    margin-bottom: 10px;
  }

  .member-card .desc {
    font-size: 13px;
    color: var(--ink-light);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .member-card .actions {
    display: flex
