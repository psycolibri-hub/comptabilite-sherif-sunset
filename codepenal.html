<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3;url=https://docs.google.com/document/d/1Q0gnWGrkhVZl-N663284Ht-1lNU3he0aysZR2efKepA/edit?tab=t.0">
<title>Code pénal — Bureau du Shérif de Sunset</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rye&family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --parchment: #f4e4bc;
    --parchment-dark: #e8d5a3;
    --wood-dark: #3d2b1f;
    --wood-medium: #5c3d2e;
    --wood-light: #8b5e3c;
    --gold: #c9a227;
    --gold-light: #e8c84b;
    --rust: #8b3a1a;
    --ink: #2a1a0f;
    --ink-light: #5a3d2a;
    --cream: #faf3e0;
    --shadow: rgba(42, 26, 15, 0.15);
    --shadow-heavy: rgba(42, 26, 15, 0.35);
  }

  body {
    font-family: 'Playfair Display', Georgia, serif;
    background: var(--parchment);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .wood-border-top {
    height: 8px;
    background: linear-gradient(180deg, var(--wood-dark) 0%, var(--wood-medium) 50%, var(--wood-dark) 100%);
    border-bottom: 2px solid var(--gold);
    box-shadow: 0 2px 12px var(--shadow-heavy);
    flex-shrink: 0;
  }

  .wood-border-bottom {
    height: 8px;
    background: linear-gradient(180deg, var(--wood-dark) 0%, var(--wood-medium) 50%, var(--wood-dark) 100%);
    border-top: 2px solid var(--gold);
    box-shadow: 0 -2px 12px var(--shadow-heavy);
    flex-shrink: 0;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  .back-link {
    position: absolute;
    left: 20px;
    top: 20px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--wood-light);
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.2s;
  }

  .back-link:hover { color: var(--rust); }

  .icon-book {
    width: 64px;
    height: 64px;
    stroke: var(--wood-dark);
    stroke-width: 1.2;
    fill: none;
    margin-bottom: 24px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  h1 {
    font-family: 'Rye', 'Cinzel', serif;
    font-size: clamp(26px, 5vw, 40px);
    color: var(--wood-dark);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 1px 1px 0 var(--parchment-dark), 2px 2px 0 var(--shadow);
    margin-bottom: 12px;
  }

  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--ink-light);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 32px;
    max-width: 300px;
    width: 100%;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--wood-light), transparent);
  }

  .divider-ornament {
    width: 8px;
    height: 8px;
    border: 1.5px solid var(--gold);
    transform: rotate(45deg);
    background: var(--parchment);
  }

  .redirect-box {
    background: var(--cream);
    border: 1.5px solid var(--wood-light);
    border-radius: 4px;
    padding: 32px 28px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 2px 12px var(--shadow);
  }

  .redirect-text {
    font-size: 16px;
    color: var(--ink-light);
    line-height: 1.7;
    margin-bottom: 24px;
    font-style: italic;
  }

  .redirect-link {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-light);
    background: var(--wood-dark);
    padding: 14px 28px;
    border-radius: 4px;
    text-decoration: none;
    transition: all 0.25s ease;
    border: 1px solid var(--wood-dark);
  }

  .redirect-link:hover {
    background: var(--wood-medium);
    color: var(--gold);
    box-shadow: 0 4px 16px var(--shadow-heavy);
  }

  .manual-text {
    margin-top: 20px;
    font-size: 12px;
    color: var(--ink-light);
    opacity: 0.7;
  }

  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 20px;
    border-top: 1px solid var(--wood-light);
    margin: 0 20px;
  }

  footer p {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--ink-light);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  footer .star-sep {
    color: var(--gold);
    margin: 0 8px;
  }
</style>
</head>
<body>

  <div class="wood-border-top"></div>

  <main>
    <a href="index.html" class="back-link">← Retour</a>

    <svg class="icon-book" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </svg>

    <h1>Code pénal</h1>
    <p class="subtitle">Ville de Sunset — Texas</p>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-ornament"></div>
      <div class="divider-line"></div>
    </div>

    <div class="redirect-box">
      <p class="redirect-text">
        Vous allez être redirigé vers le code pénal du Bureau du Shérif de Sunset...
      </p>
      <a class="redirect-link" href="https://docs.google.com/document/d/1Q0gnWGrkhVZl-N663284Ht-1lNU3he0aysZR2efKepA/edit?tab=t.0">
        Ouvrir le document
      </a>
      <p class="manual-text">
        Si la redirection ne fonctionne pas, cliquez sur le bouton ci-dessus.
      </p>
    </div>
  </main>

  <footer>
    <p>Bureau du Shérif de Sunset <span class="star-sep">★</span> Établi 1904 <span class="star-sep">★</span> Serveur Red Dead RP</p>
  </footer>

  <div class="wood-border-bottom"></div>

</body>
</html>
